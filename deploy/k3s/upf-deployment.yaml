apiVersion: v1
kind: ConfigMap
metadata:
  name: upf-config
  namespace: default
data:
  upfcfg.yaml: |
    version: 1.0.3
    description: UPF configuration

    pfcp:
      addr: 0.0.0.0
      nodeID: upf
      retransTimeout: 1s
      maxRetrans: 3

    gtpu:
      forwarder: gtp5g
      ifList:
        - addr: 0.0.0.0
          type: N3

    dnnList:
      - dnn: internet
        cidr: 10.60.0.0/16

    logger:
      enable: true
      level: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upf
  namespace: default
  labels:
    app: upf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: upf
  template:
    metadata:
      labels:
        app: upf
    spec:
      initContainers:
        - name: upf-node-check
          image: busybox:1.36
          command:
            - sh
            - -ec
            - |
              test -c /dev/net/tun
              grep -qw gtp5g /proc/modules
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
      containers:
        - name: upf
          image: free5gc/upf:v4.2.0
          command: ["/free5gc/upf"]
          args: ["-c", "/free5gc/config/upfcfg.yaml"]
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
          ports:
            - containerPort: 8805
              protocol: UDP
              name: pfcp
            - containerPort: 2152
              protocol: UDP
              name: gtpu
          volumeMounts:
            - name: upf-config
              mountPath: /free5gc/config/upfcfg.yaml
              subPath: upfcfg.yaml
            - name: dev-net-tun
              mountPath: /dev/net/tun
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: upf-config
          configMap:
            name: upf-config
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
apiVersion: v1
kind: Service
metadata:
  name: upf
  namespace: default
  labels:
    app: upf
spec:
  selector:
    app: upf
  ports:
    - name: pfcp
      port: 8805
      targetPort: 8805
      protocol: UDP
    - name: gtpu
      port: 2152
      targetPort: 2152
      protocol: UDP
