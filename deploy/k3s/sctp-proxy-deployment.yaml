apiVersion: apps/v1
kind: Deployment
metadata:
  name: sctp-proxy
  namespace: default
  labels:
    app: sctp-proxy
    app.kubernetes.io/part-of: serverless5gc
    serverless5gc.knative.dev/events: "enabled"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sctp-proxy
  template:
    metadata:
      labels:
        app: sctp-proxy
        app.kubernetes.io/part-of: serverless5gc
        serverless5gc.knative.dev/events: "enabled"
    spec:
      containers:
        - name: sctp-proxy
          image: ghcr.io/atnog/serverless5gc-knative/sctp-proxy:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 38412
              protocol: SCTP
              name: ngap
          env:
            - name: SCTP_LISTEN_ADDR
              value: "0.0.0.0:38412"
            - name: REDIS_ADDR
              value: "redis:6379"
            - name: FUNCTION_NAMESPACE
              value: "default"
            - name: CLUSTER_DOMAIN
              value: "cluster.local"
            - name: FUNCTION_URL_TEMPLATE
              value: "http://%s.default.svc.cluster.local"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sctp-proxy
  namespace: default
  labels:
    app: sctp-proxy
spec:
  type: NodePort
  selector:
    app: sctp-proxy
  ports:
    - name: ngap
      port: 38412
      targetPort: 38412
      nodePort: 31412
      protocol: SCTP
