---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: nrf-register
  namespace: default
  labels:
    app.kubernetes.io/name: nrf-register
    app.kubernetes.io/part-of: serverless5gc
    app.kubernetes.io/component: procedure-function
    serverless5gc.knative.dev/events: "enabled"
    serverless5gc.knative.dev/saf-protected: "true"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "50"
        autoscaling.knative.dev/metric: "concurrency"
        autoscaling.knative.dev/target: "10"
        qpoption.knative.dev/firewall-activate: "enable"
        qpoption.knative.dev/firewall-config-rules-json: '{"request":{"default-action":"accept","rules":[{"action":"drop","expression":".REQUEST.URI.path == \"/\" and ((.REQUEST.METHOD | ascii_upcase) != \"POST\")"},{"action":"drop","expression":".REQUEST.URI.path == \"/\" and ((.REQUEST.BODY | type) != \"object\")"},{"action":"drop","expression":".REQUEST.URI.path == \"/\" and (.REQUEST.BODY.nfType? | type != \"string\" or (IN(\"AMF\", \"SMF\", \"UPF\", \"AUSF\", \"UDM\", \"UDR\", \"NRF\", \"NSSF\", \"PCF\", \"CHF\", \"BSF\", \"NWDAF\", \"NSACF\") | not))"},{"action":"drop","expression":".REQUEST.URI.path == \"/\" and ((.REQUEST.METHOD | ascii_upcase) == \"POST\") and ((.REQUEST.BODY | keys | map(select(. != \"nfInstanceId\" and . != \"nfType\" and . != \"nfStatus\" and . != \"ipv4Addresses\" and . != \"nfServices\" and . != \"plmnList\" and . != \"heartBeatTimer\")) | length) > 0)"},{"action":"drop","expression":".REQUEST.URI.path == \"/\" and (.REQUEST.BODY.nfInstanceId? | type != \"string\" or length < 3 or length > 128 or (test(\"^[A-Za-z0-9_.:-]+$\") | not))"},{"action":"drop","expression":".REQUEST.URI.path == \"/\" and (((.REQUEST.BODY.nfServices? // []) | type != \"array\") or ((.REQUEST.BODY.nfServices? // []) | length > 32))"}]}}'
      labels:
        app.kubernetes.io/name: nrf-register
        app.kubernetes.io/part-of: serverless5gc
        app.kubernetes.io/component: procedure-function
        serverless5gc.knative.dev/events: "enabled"
        serverless5gc.knative.dev/saf-protected: "true"
    spec:
      containerConcurrency: 10
      timeoutSeconds: 60
      containers:
        - image: ghcr.io/atnog/serverless5gc-knative/nrf-register:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: FUNCTION_NAME
              value: "nrf-register"
            - name: FUNCTION_NAMESPACE
              value: "default"
            - name: CLUSTER_DOMAIN
              value: "cluster.local"
            - name: FUNCTION_URL_TEMPLATE
              value: "http://%s.default.svc.cluster.local"
            - name: ETCD_ENDPOINT
              value: "etcd:2379"
